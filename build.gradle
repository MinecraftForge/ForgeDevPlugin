import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    alias libs.plugins.gradleutils
    alias libs.plugins.gitversion
    alias libs.plugins.changelog
    alias libs.plugins.licenser
    alias libs.plugins.shadow apply false
}

gradleutils.displayName = 'ForgeDev'
description = "Forge's Gradle plugin to initialize and streamline the development of Minecraft Forge and its loader."
group = 'net.minecraftforge'
version = gitversion.tagOffset

println "Version: $version"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

gradleutils.pluginDevDefaults(configurations, libs.versions.gradle)

dependencies {
    implementation libs.srgutils
    implementation libs.fastcsv
    implementation libs.jarjar
    implementation libs.maven.artifact

    // Static Analysis
    compileOnly libs.nulls

    // Gradle API
    compileOnly libs.gradle

    // GradleUtils Shared Base
    implementation libs.gradleutils.shared

    // Plugins
    compileOnly libs.gradle.download

    // Utils
    implementation libs.bundles.asm
    implementation libs.bundles.utils
}

license {
    header = rootProject.file('LICENSE-header.txt')
    newLine = false
    exclude '**/*.properties'
}

tasks.named('jar', Jar) {
    archiveClassifier = 'thin'
}

pluginManager.withPlugin(libs.plugins.shadow.get().pluginId) {
    tasks.named('shadowJar', ShadowJar) {
        enableAutoRelocation = true
        archiveClassifier = null
        relocationPrefix = 'net.minecraftforge.forgedev.shadow'
    }
}

tasks.withType(Javadoc).configureEach {
    javadocTool = javaToolchains.javadocToolFor { languageVersion = JavaLanguageVersion.of(24) }
}

changelog {
    fromBase()
}

gradlePlugin {
    website = gitversion.url
    vcsUrl = gitversion.url + '.git'

    plugins {
        register('forgedev') {
            id = 'net.minecraftforge.forgedev'
            implementationClass = 'net.minecraftforge.forgedev.ForgeDevPlugin'
            displayName = gradleutils.displayName.get()
            description = project.description
            tags = ['minecraftforge']
        }

        register('convention') {
            id = 'net.minecraftforge.forge.build.convention'
            implementationClass = 'net.minecraftforge.forgedev.legacy.SharedBuildPlugin'
        }
    }
}

publishing {
    repositories {
        maven gradleutils.publishingForgeMaven
    }

    publications.register('pluginMaven', MavenPublication) {
        changelog.publish(it)
        gradleutils.promote(it)

        pom { pom ->
            name = gradleutils.displayName
            description = project.description

            gradleutils.pom.addRemoteDetails(pom)

            licenses {
                license gradleutils.pom.licenses.LGPLv2_1
            }

            developers {
                developer gradleutils.pom.developers.Jonathing
                developer gradleutils.pom.developers.LexManos
            }
        }
    }
}
